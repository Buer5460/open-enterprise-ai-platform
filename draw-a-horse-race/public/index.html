<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Draw a Horse · Then Race It</title>
<link rel="stylesheet" href="/styles.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="app">
  <div class="top"><div class="brand">DRAW A HORSE</div><div class="wallet">🪙 <span id="points">0</span> 积分</div></div>

  <section id="home" class="screen active">
    <div class="hero">
      <span class="horse-mark">🐎</span>
      <h1>Draw a Horse.<br>Then Race It.</h1>
      <p>自己画一匹马，邀请朋友加入房间。3 人以上即可开赛，看着自己的手绘马完成一整场比赛。</p>
      <button class="btn primary" data-go="draw">画我的马</button>
      <button class="btn secondary" data-go="join">加入好友房间</button>
    </div>
    <div class="card">
      <b>每日积分 +100</b>
      <div class="sub">积分仅用于游戏内竞猜和虚拟权益，不支持提现、转账或兑换现金。</div>
      <button id="dailyBtn" class="btn ghost">领取今日积分</button>
    </div>
  </section>

  <section id="join" class="screen">
    <div class="section-title">加入房间</div>
    <div class="card">
      <input id="joinCode" type="text" inputmode="numeric" maxlength="4" placeholder="输入 4 位房间号">
      <button id="joinBtn" class="btn primary">加入</button>
      <button class="btn secondary" data-go="home">返回</button>
    </div>
  </section>

  <section id="draw" class="screen">
    <div class="section-title">画你的马</div><div class="sub">画得越有个性越好。</div>
    <canvas id="drawCanvas" width="760" height="680"></canvas>
    <div class="tools">
      <label class="chip">颜色 <input id="color" type="color" value="#111111"></label>
      <label class="chip">粗细 <input id="size" type="range" min="4" max="30" value="12"></label>
      <button id="undoBtn" class="chip">撤销</button><button id="clearBtn" class="chip">清空</button>
    </div>
    <div class="card">
      <input id="horseName" type="text" maxlength="10" placeholder="给马取名，例如：闪电土豆">
      <button id="finishDrawBtn" class="btn primary">完成</button>
    </div>
  </section>

  <section id="horse" class="screen">
    <div class="section-title">你的马诞生了</div>
    <div class="card preview"><img id="horsePreview" class="thumb"><div><b id="horseTitle"></b><div id="horseComment" class="sub"></div></div></div>
    <div class="card">
      <div class="stat"><span>速度</span><b id="speedStat"></b></div>
      <div class="stat"><span>耐力</span><b id="staminaStat"></b></div>
      <div class="stat"><span>爆发</span><b id="burstStat"></b></div>
      <div class="stat"><span>幸运</span><b id="luckStat"></b></div>
    </div>
    <button id="createRoomBtn" class="btn primary">创建比赛房间</button>
    <button class="btn secondary" data-go="join">加入别人房间</button>
  </section>

  <section id="room" class="screen">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:10px">
      <div><div class="section-title">比赛房间</div><div id="roomStatus" class="sub">等待参赛者</div></div>
      <div id="roomCode" class="room-code"></div>
    </div>
    <div id="players" class="players"></div>
    <button id="shareBtn" class="btn secondary">邀请好友</button>
    <button id="betOpenBtn" class="btn ghost">积分竞猜</button>
    <button id="startRaceBtn" class="btn primary" disabled>至少 3 人才能开始</button>
  </section>

  <section id="bet" class="screen">
    <div class="section-title">竞猜本场冠军</div>
    <div class="sub">只使用系统虚拟积分，不涉及现金。</div>
    <div id="betList" class="bet-list"></div>
    <div class="card">
      <input id="betAmount" type="number" value="20" min="10" max="500" step="10">
      <button id="confirmBetBtn" class="btn primary">确认竞猜</button>
      <button class="btn secondary" data-go="room">返回</button>
    </div>
  </section>

  <section id="race" class="screen">
    <div class="section-title">比赛进行中</div>
    <div class="track-shell">
      <div id="track" class="track">
        <div class="finish"></div>
        <div id="countdown" class="countdown"></div>
      </div>
      <div class="race-hud"><span id="raceClock">0.0s</span><span id="leaderText">准备起跑</span></div>
      <div class="progressbar"><div id="raceProgress"></div></div>
      <div id="commentary" class="commentary">骑手准备中……</div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="section-title">比赛结果</div>
    <div id="results" class="results"></div>
    <button id="rematchBtn" class="btn primary">回到房间</button>
    <button class="btn secondary" data-go="home">返回首页</button>
  </section>

  <div class="legal">积分为封闭式游戏积分，不出售、不提现、不转账、不兑换现金。支付功能仅用于皮肤、AI 动画等虚拟商品。</div>
</div>
<div id="toast" class="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
