<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draw a Horse Admin</title><link rel="stylesheet" href="/styles.css"></head><body><div id="app"><div class="section-title">运营后台</div><div class="sub">输入部署环境中的 ADMIN_TOKEN 查看。</div><div class="card"><input id="token" type="text" placeholder="ADMIN_TOKEN"><button id="load" class="btn primary">载入数据</button></div><div id="stats" class="navgrid"></div><div class="section-title" style="margin-top:20px">最近比赛</div><div id="races" class="results"></div></div><script>
const $=s=>document.querySelector(s);$("#load").onclick=async()=>{const t=$("#token").value.trim();const [s,r]=await Promise.all([fetch(`/api/admin/stats?token=${encodeURIComponent(t)}`).then(x=>x.json()),fetch(`/api/admin/races?token=${encodeURIComponent(t)}`).then(x=>x.json())]);if(!s.users&&s.ok===false){alert(s.message);return}$("#stats").innerHTML=[["用户",s.users],["实时房间",s.liveRooms],["比赛",s.races],["支付订单",s.purchases],["积分总量",s.totalPoints]].map(x=>`<div class="navtile"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");$("#races").innerHTML=r.map(x=>`<div class="result-row"><div><b>房间 #${x.roomCode}</b><div class="mini">${new Date(x.finishedAt).toLocaleString()} · 冠军 ${x.results?.[0]?.name||"-"}</div></div></div>`).join("")||"<div class='empty'>暂无比赛</div>"};
</script></body></html>
