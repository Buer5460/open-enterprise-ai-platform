name: Feature request
description: Propose a platform, package, runtime, or developer-experience improvement
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What business or developer problem should OEAP solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior or API.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App Builder
        - App Runtime
        - Agent / Skill Runtime
        - Workflow
        - Connector / MCP
        - Package System
        - Developer Studio
        - Marketplace
        - Security / Permissions
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: notes
    attributes:
      label: Additional context
