name: Marketplace Publisher Review Patch

on:
  push:
    branches: [feat/marketplace-publisher-review]
    paths:
      - "scripts/patch-marketplace-publisher-review.mjs"
      - ".github/workflows/marketplace-publisher-review-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/marketplace-publisher-review
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply publisher/review integration patch
        run: node scripts/patch-marketplace-publisher-review.mjs
      - name: Commit integrated sources
        shell: bash
        run: |
          git config user.name "oeap-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Marketplace publisher review lifecycle"
          git push origin HEAD:feat/marketplace-publisher-review
