name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Verify pnpm version
        run: corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build workspace
        run: corepack pnpm build

      - name: Run deterministic test suite
        run: corepack pnpm test

      - name: Validate shell scripts
        run: |
          bash -n scripts/start-local.sh
          bash -n scripts/test-ci.sh
          bash -n scripts/backup-data.sh
          bash -n scripts/restore-data.sh

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Build API container
        run: docker build --target api -t oeap-api-ci .

      - name: Build Web container
        run: docker build --target web -t oeap-web-ci .

      - name: Note external AI-runtime integration
        run: |
          echo "DeepSeek Harness live integration is intentionally not executed in public CI because it requires an external Harness checkout and provider credentials."
