name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Verify pnpm version
        run: corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build workspace
        run: corepack pnpm -r build

      - name: Run deterministic local tests
        run: |
          if [ -f scripts/test-action-gateway.mjs ]; then node scripts/test-action-gateway.mjs; fi
          if [ -f scripts/test-installable-skill.mjs ]; then node scripts/test-installable-skill.mjs; fi
          if [ -f scripts/test-growth-agent.mjs ]; then node scripts/test-growth-agent.mjs; fi
          if [ -f scripts/test-growth-workflow.mjs ]; then node scripts/test-growth-workflow.mjs; fi
          if [ -f scripts/test-developer-studio.mjs ]; then node scripts/test-developer-studio.mjs; fi
          if [ -f scripts/test-tenancy.mjs ]; then node scripts/test-tenancy.mjs; fi
          if [ -f scripts/test-auth-session.mjs ]; then node scripts/test-auth-session.mjs; fi

      - name: Note AI-runtime integration tests
        run: |
          echo "DeepSeek Harness integration tests are intentionally excluded from public CI because they require an external Harness checkout and credentials/runtime configuration."
