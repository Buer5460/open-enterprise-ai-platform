name: Marketplace Phase 2 Patch

on:
  push:
    branches: [feat/marketplace-commerce-mvp]
    paths:
      - "scripts/patch-marketplace-phase2.mjs"
      - ".github/workflows/marketplace-phase2-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/marketplace-commerce-mvp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply deterministic source patch
        run: node scripts/patch-marketplace-phase2.mjs

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "oeap-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: wire marketplace commerce UI"
          git push origin HEAD:feat/marketplace-commerce-mvp
