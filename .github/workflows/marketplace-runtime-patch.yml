name: Marketplace Runtime Patch

on:
  push:
    branches: [feat/marketplace-runtime-install]
    paths:
      - "scripts/patch-marketplace-runtime.mjs"
      - ".github/workflows/marketplace-runtime-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/marketplace-runtime-install
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply runtime integration patch
        run: node scripts/patch-marketplace-runtime.mjs
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "oeap-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect marketplace acquisition to runtime"
          git push origin HEAD:feat/marketplace-runtime-install
