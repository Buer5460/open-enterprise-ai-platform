name: Draw a Horse CI

on:
  push:
    branches: [draw-a-horse-race]
    paths:
      - "draw-a-horse-race/**"
      - ".github/workflows/draw-a-horse-race.yml"
  pull_request:
    paths:
      - "draw-a-horse-race/**"
      - ".github/workflows/draw-a-horse-race.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draw-a-horse-race
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: npm run check
      - name: Race engine tests
        run: npm test
